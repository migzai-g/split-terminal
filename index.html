<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>s.p.l.i.t</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1 class="logo">s.p.l.i.t - <span>termi.nal</span></h1>
    <nav>
      <a href="#">lobo.tomy</a>
      <a href="#">m.ain</a>
    </nav>
  </header>

  <main>
    <div class="terminal-box">
      <div class="box-header">// terminal</div>
      <div class="terminal">
        <div class="terminal-output" id="output"></div>
        <div class="terminal-input-row">
          <span class="prompt">guest@split:~$</span>
          <input id="cmd" type="text" autocomplete="off" spellcheck="false" />
        </div>
      </div>
    </div>
    <div class="posts-box">
      <div class="box-header">// posts</div>
      <div class="posts"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
